type User {
  id: ID!
  email: String!
  name: String!
  role: Role!
  avatarUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
  projects: [Project!]!
}

type UserEdge {
  cursor: String!
  node: User!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AuthPayload {
  token: String!
  user: User!
}

input RegisterInput {
  email: String!
  name: String!
  password: String!
}

input LoginInput {
  email: String!
  password: String!
}

input UpdateProfileInput {
  name: String
  avatarUrl: String
}

extend type Query {
  me: User! @auth(requires: VIEWER)
  user(id: ID!): User @auth(requires: VIEWER)
  users(first: Int, after: String, search: String): UserConnection! @auth(requires: VIEWER)
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  updateProfile(input: UpdateProfileInput!): User! @auth(requires: VIEWER)
  updateUserRole(id: ID!, role: Role!): User! @auth(requires: ADMIN)
}
